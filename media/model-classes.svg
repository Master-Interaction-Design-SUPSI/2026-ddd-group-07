<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" xmlns:c2pa="http://c2pa.org/manifest">
  <title>AI Energy Score model classes by size: A up to 20 billion parameters, B up to 66 billion, C more than 66 billion</title>
  <rect width="1200" height="600" fill="#ffffff"/>
  <g font-family="Inter, Helvetica, Arial, sans-serif" fill="#1a1a1a">
    <text x="60" y="80" font-size="26" font-weight="700" fill="#d93025" letter-spacing="1">MODEL SIZE · AI ENERGY SCORE CLASSES</text>
    <text x="60" y="122" font-size="26" fill="#555555">Parameters are the numbers a model learns. Bigger models usually drive further.</text>

    <line x1="60" y1="300" x2="1140" y2="300" stroke="#dddddd" stroke-width="2"/>

    <!-- Class A -->
    <circle cx="230" cy="300" r="34" fill="#d93025"/>
    <text x="230" y="312" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
    <text x="230" y="400" font-size="32" font-weight="700" text-anchor="middle">up to 20 billion</text>
    <text x="230" y="448" font-size="24" fill="#555555" text-anchor="middle">e.g. distilgpt2</text>
    <text x="230" y="482" font-size="24" fill="#555555" text-anchor="middle">6.3 m</text>

    <!-- Class B -->
    <circle cx="600" cy="300" r="58" fill="#d93025"/>
    <text x="600" y="318" font-size="50" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
    <text x="600" y="400" font-size="32" font-weight="700" text-anchor="middle">up to 66 billion</text>
    <text x="600" y="448" font-size="24" fill="#555555" text-anchor="middle">e.g. Yi-1.5-34B</text>
    <text x="600" y="482" font-size="24" fill="#555555" text-anchor="middle">270.9 m</text>

    <!-- Class C -->
    <circle cx="970" cy="300" r="84" fill="#d93025"/>
    <text x="970" y="326" font-size="72" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
    <text x="970" y="420" font-size="32" font-weight="700" text-anchor="middle">more than 66 billion</text>
    <text x="970" y="464" font-size="24" fill="#555555" text-anchor="middle">e.g. Command R+</text>
    <text x="970" y="498" font-size="24" fill="#555555" text-anchor="middle">16.55 km</text>

    <text x="60" y="560" font-size="20" fill="#888888">Distances: GPU electricity for the same 1,000 prompts, driven by an electric car from Mendrisio.</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
