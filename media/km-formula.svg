<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" xmlns:c2pa="http://c2pa.org/manifest">
  <title>From electricity to distance: km = GPU kWh per 1,000 prompts ÷ 0.207 kWh per km</title>
  <rect width="1200" height="480" fill="#ffffff"/>
  <g font-family="Inter, Helvetica, Arial, sans-serif" fill="#1a1a1a">
    <text x="60" y="80" font-size="26" font-weight="700" fill="#d93025" letter-spacing="1">FROM ELECTRICITY TO DISTANCE</text>

    <text x="60" y="160" font-size="30" fill="#555555">An electric car uses</text>
    <text x="60" y="210" font-size="44" font-weight="700">20.7 kWh per 100 km = 0.207 kWh per km</text>

    <line x1="60" y1="260" x2="1140" y2="260" stroke="#dddddd" stroke-width="2"/>

    <text x="60" y="320" font-size="30" fill="#555555">So the distance driven on one model's electricity is</text>
    <text x="60" y="400" font-size="50" font-weight="700">
      <tspan fill="#d93025">km</tspan>
      <tspan> = </tspan>
      <tspan>GPU kWh for 1,000 prompts</tspan>
      <tspan fill="#d93025"> ÷ 0.207</tspan>
    </text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
